name: Cypress Tests w/ Allure Reporting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Checkout gh-pages branch for Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-allure-history

      - name: Prepare Allure history directory
        run: |
          mkdir -p allure-results
          if [ -d "gh-pages-allure-history/allure-report/history" ]; then
            cp -r gh-pages-allure-history/allure-report/history allure-results/
            echo "Allure history copied from gh-pages branch."
          else
            echo "No Allure history found on gh-pages branch. Starting fresh."
          fi

      - name: Run Cypress Tests
        run: npm run test || true

      - name: Create Allure executor file
        if: always()
        run: |
          echo '{ "name": "GitHub Actions", "type": "github", "buildName": "Build #${{ github.run_number }}", "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "reportUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }' > allure-results/executor.json

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          enable_jekyll: true
          keep_files: true